# Replace client_id / application_url after creating the app in Shopify Dev Dashboard.
# Do not put FASHN_API_KEY here.
name = "KOKO Try-On AI"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://REPLACE_WITH_PUBLIC_HTTPS_HOST"
embedded = false

[access_scopes]
scopes = "write_app_proxy"

[auth]
redirect_urls = [ "https://REPLACE_WITH_PUBLIC_HTTPS_HOST/auth/callback" ]

[app_proxy]
url = "/apps/koko-tryon"
prefix = "apps"
subpath = "koko-tryon"

[build]
automatically_update_urls_on_dev = true
